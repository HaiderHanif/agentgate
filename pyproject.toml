[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.1.0"
description = "Regression gating for AI agents: golden-trace recording, deterministic replay, and CI gates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Haider Hanif", email = "founder@urdugen.com" }]
keywords = [
    "ai-agents",
    "llm",
    "evaluation",
    "testing",
    "regression-testing",
    "observability",
    "llmops",
    "mcp",
    "pytest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.27.0",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/HaiderHanif/agentgate"
Repository = "https://github.com/HaiderHanif/agentgate"
Issues = "https://github.com/HaiderHanif/agentgate/issues"
Changelog = "https://github.com/HaiderHanif/agentgate/blob/main/CHANGELOG.md"

[project.scripts]
agentgate = "agentgate.cli:main"

[project.entry-points.pytest11]
agentgate = "agentgate.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.agentgate]
trace_dir = "examples/refund_agent/traces"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "ARG", "TID"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"examples/*" = ["ARG001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/agentgate"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/agentgate"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
