[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.1.0"
description = "Regression gating for AI agents: golden-trace recording, deterministic replay, and CI gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haider Hanif", email = "founder@urdugen.com" }]
keywords = [
  "ai-agents",
  "llm",
  "evaluation",
  "testing",
  "regression-testing",
  "observability",
  "llmops",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/HaiderHanif/agentgate"
Repository = "https://github.com/HaiderHanif/agentgate"
Issues = "https://github.com/HaiderHanif/agentgate/issues"
Changelog = "https://github.com/HaiderHanif/agentgate/blob/main/CHANGELOG.md"

[project.scripts]
agentgate = "agentgate.cli:app"

[project.entry-points.pytest11]
agentgate = "agentgate.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agentgate"]
