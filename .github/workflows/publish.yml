name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
