name: Bug report
description: Something behaves incorrectly
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction makes this far faster to fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest agent, trace, or command that shows the problem.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: agentgate version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: shell

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: My example contains no secrets or personal data
          required: true
