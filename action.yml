name: "agentgate"
description: "Fail the build when an AI agent's behaviour diverges from its golden trace."
author: "Haider Hanif"

branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  agent:
    description: "Agent entrypoint as module:callable"
    required: true
  trace:
    description: "Path to the golden trace JSON file"
    required: true
  max-cost:
    description: "Cost ceiling for the run, in USD"
    required: false
    default: ""
  max-latency:
    description: "Latency budget for the run, in milliseconds"
    required: false
    default: ""
  similarity:
    description: "Final output similarity threshold, 0 to 1"
    required: false
    default: "0.85"
  require-signature:
    description: "Refuse to verify a trace that is unsigned or tampered with"
    required: false
    default: "false"
  python-version:
    description: "Python version used to run the check"
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Installs the action's own checked-out source rather than a release from
    # PyPI. Without this, pinning `uses: HaiderHanif/agentgate@<sha>` pins the
    # action definition but not the code it runs, so a compromised or simply
    # newer PyPI release would execute inside a workflow that believed itself
    # pinned.
    - name: Install agentgate
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "$GITHUB_ACTION_PATH"

    # Inputs are passed through the environment and assembled into a quoted
    # array. They are never interpolated into shell source, so quotes, command
    # substitutions, newlines and glob characters in an input are inert data.
    - name: Verify agent against golden trace
      shell: bash
      env:
        AGENTGATE_AGENT: ${{ inputs.agent }}
        AGENTGATE_TRACE: ${{ inputs.trace }}
        AGENTGATE_SIMILARITY: ${{ inputs.similarity }}
        AGENTGATE_MAX_COST: ${{ inputs.max-cost }}
        AGENTGATE_MAX_LATENCY: ${{ inputs.max-latency }}
        AGENTGATE_REQUIRE_SIGNATURE: ${{ inputs.require-signature }}
      run: |
        set -euo pipefail

        args=(
          verify
          "$AGENTGATE_AGENT"
          "$AGENTGATE_TRACE"
          --similarity "$AGENTGATE_SIMILARITY"
          --github
        )

        if [ -n "$AGENTGATE_MAX_COST" ]; then
          args+=(--max-cost "$AGENTGATE_MAX_COST")
        fi

        if [ -n "$AGENTGATE_MAX_LATENCY" ]; then
          args+=(--max-latency "$AGENTGATE_MAX_LATENCY")
        fi

        if [ "$AGENTGATE_REQUIRE_SIGNATURE" = "true" ]; then
          args+=(--require-signature)
        fi

        agentgate "${args[@]}"
